name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Release validation uses the development Python from .python-version.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # Sync once; validation commands reuse the exact environment.
      - run: uv sync --locked
      - name: Verify tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-sync python -c 'import dotproperties; print(dotproperties.__version__)')"
          test "$RELEASE_TAG" = "v$version"
          grep -Fq "## [$version] - " CHANGELOG.md
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ty check
      - run: uv run --no-sync pytest -m "not interop"
      - name: Build sdist and rebuild its wheel
        run: |
          uv build --sdist
          uv build --wheel dist/*.tar.gz
      - name: Smoke-test distributions
        run: |
          uv venv "$RUNNER_TEMP/dotproperties-release-test"
          uv pip install --python "$RUNNER_TEMP/dotproperties-release-test/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/dotproperties-release-test/bin/python" -c \
            "import dotproperties; from importlib.metadata import version; assert dotproperties.__version__ == version('dotproperties'); assert dotproperties.loads('key=value') == {'key': 'value'}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: release
      url: https://pypi.org/project/dotproperties/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: Publish GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
